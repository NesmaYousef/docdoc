name: mediqa
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.3+1

environment:
  sdk: ^3.10.4


dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  #A build system for Dart code generation and modular compilation
  build_runner: ^2.10.4
  # State management
  flutter_bloc: ^9.1.1
  # Code generator (mainly used with cubit & retrofit)
  freezed: ^3.2.4
  freezed_annotation: ^3.1.0
  # for dependency injection
  get_it: ^9.2.0

  # Automatically generate code for converting to and from JSON by annotating Dart classes
  json_serializable: ^6.11.3
  json_annotation: ^4.9.0
  # Networking
  dio: ^5.9.0
  retrofit: ^4.9.2
  retrofit_generator: ^10.2.1
  pretty_dio_logger: ^1.4.0

  firebase_core: ^4.3.0
  # Flutter library to load and cache network images.
  cached_network_image: ^3.4.1
  # reading and writing simple key-value pairs
  shared_preferences: ^2.5.4
  # provides API to store data in secure storage.
  flutter_secure_storage: ^10.0.0
  # easy way to add shimmer effect
  shimmer: ^3.0.0

  # localization
  intl: ^0.20.2
  easy_localization: ^3.0.8

  # for splash screen
  flutter_native_splash: ^2.4.7
  # An SVG rendering and widget library for Flutter, which allows painting
  flutter_svg: ^2.0.9
  # for adapting screen and font size.
  flutter_screenutil: ^5.9.3
  # A Flutter package that provides a customizable and animated navigation bar widget.
  glaze_nav_bar: ^1.2.1
  image_picker: ^1.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/svgs/
    - assets/svgs/specializations/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
